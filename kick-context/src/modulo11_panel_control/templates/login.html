<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de Control — Ingreso</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f1115; color: #e7e9ee;
    }
    .card {
      width: 100%; max-width: 340px; padding: 28px;
      background: #171a21; border: 1px solid #262b36; border-radius: 12px;
    }
    h1 { margin: 0 0 4px; font-size: 18px; }
    p.sub { margin: 0 0 20px; font-size: 13px; color: #8b93a3; }
    label { display: block; font-size: 12px; margin: 12px 0 4px; color: #b7bdca; }
    input {
      width: 100%; padding: 9px 10px; font-size: 14px;
      background: #0f1115; border: 1px solid #2d3340; border-radius: 7px; color: #e7e9ee;
    }
    input:focus { outline: 2px solid #3d6fe0; border-color: transparent; }
    button {
      width: 100%; margin-top: 18px; padding: 10px; font-size: 14px; font-weight: 600;
      background: #3d6fe0; color: #fff; border: 0; border-radius: 7px; cursor: pointer;
    }
    button:hover { background: #3059c4; }
    .error {
      margin-top: 14px; padding: 8px 10px; font-size: 13px;
      background: #3a1d21; border: 1px solid #6b2b32; border-radius: 7px; color: #f2b8bd;
    }
  </style>
</head>
<body>
  <form class="card" method="post" action="{{ url_for('login') }}">
    <h1>Panel de Control</h1>
    <p class="sub">Sistema de contexto en vivo — Kick</p>

    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" type="text" autocomplete="username" autofocus required>

    <label for="contrasena">Contraseña</label>
    <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>

    <button type="submit">Ingresar</button>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
  </form>
</body>
</html>
