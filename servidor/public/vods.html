<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamChat – VODs</title>
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/kd.css" />
<script>try{if(localStorage.getItem('kd_theme')==='light')document.documentElement.classList.add('kd-light')}catch(e){}</script>
</head>
<body class="kd">
  <header id="chat-header" class="kd-top"></header>

  <main class="kd-main">
    <p id="vod-msg" class="settings-msg" hidden></p>

    <div class="kd-cols-2" style="grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)">

      <!-- VODs y clips -->
      <section class="kd-card">
        <div class="kd-card-head">
          <span class="kd-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m10 9 5 3-5 3Z"/></svg></span>
          <div>
            <div class="kd-card-title">Tus VODs y clips</div>
            <div class="kd-card-sub">Pegá la URL de un VOD o clip de Kick</div>
          </div>
        </div>

        <div class="kd-addrow" style="margin-bottom:12px">
          <input id="vod-url-input" type="url" placeholder="https://kick.com/canal/videos/... o /clips/..." />
          <button id="btn-add-vod" class="btn btn-primary" type="button">Agregar</button>
        </div>

        <div id="vod-list" class="vod-list">
          <p class="vod-empty">Cargando…</p>
        </div>
      </section>

      <!-- Generador de vistas (como "Viewers") -->
      <section class="kd-card hl">
        <div class="kd-card-head">
          <span class="kd-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></span>
          <div>
            <div class="kd-card-title">Generador de vistas</div>
            <div class="kd-card-sub">Sesión de visitas a tus VODs</div>
          </div>
        </div>

        <div id="viewer-stats" class="viewer-stats">
          <div class="viewer-stat"><div class="lbl">Estado</div><div class="val" id="stat-status">—</div></div>
          <div class="viewer-stat"><div class="lbl">Tiempo activo</div><div class="val" id="stat-uptime">—</div></div>
          <div class="viewer-stat"><div class="lbl">Vistas generadas</div><div class="val" id="stat-views-gen">0</div></div>
          <div class="viewer-stat"><div class="lbl">Fallos</div><div class="val" id="stat-views-fail">0</div></div>
          <div class="viewer-stat"><div class="lbl">Esta hora</div><div class="val" id="stat-hourly">0 / 50</div></div>
          <div class="viewer-stat"><div class="lbl">Totales</div><div class="val" id="stat-total">0</div></div>
          <div class="viewer-stat wide"><div class="lbl">Visitando ahora</div><div class="val" id="stat-current-visit">—</div></div>
        </div>

        <div id="hourly-progress" class="progress-bar" style="display:none;margin-top:12px"><div class="fill" id="hourly-fill" style="width:0%"></div></div>

        <div class="kd-btns" style="margin-top:14px">
          <button id="btn-start-viewer" class="kd-btn kd-btn-primary kd-btn-block" type="button">▶ Iniciar visitas</button>
          <button id="btn-stop-viewer" class="kd-btn kd-btn-red kd-btn-block" type="button" style="display:none">■ Detener visitas</button>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="js/vods-ui.js"></script>
</body>
</html>
