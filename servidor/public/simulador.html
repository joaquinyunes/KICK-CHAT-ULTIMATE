<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamChat – Simulador</title>
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/client-nav.css" />
<style>
  .sim-layout { flex:1; display:flex; gap:16px; padding:16px; overflow:hidden; }
  .sim-controls { width:320px; flex-shrink:0; display:flex; flex-direction:column; gap:12px; overflow-y:auto; }
  .sim-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; }
  .sim-card h3 { font-size:12px; margin:0 0 10px; color:var(--text); font-weight:600; }
  .sim-output { flex:1; display:flex; flex-direction:column; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); overflow:hidden; }
  .sim-output-head { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--border); font-size:13px; font-weight:600; flex-wrap:wrap; gap:8px; }
  .sim-actions { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  #sim-msgs { flex:1; overflow-y:auto; padding:4px 0; font-size:13px; }
  .msg { display:flex; gap:6px; padding:3px 14px; line-height:1.4; animation:fadeIn .15s ease; }
  .msg-user { font-weight:700; color:var(--accent); flex-shrink:0; }
  .msg-sep { color:var(--text-muted); }
  .msg-text { color:var(--text); word-break:break-word; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(2px)} to{opacity:1;transform:translateY(0)} }
  .sim-badge { display:inline-block; font-size:10px; padding:2px 8px; border-radius:20px; background:var(--surface2); border:1px solid var(--border); color:var(--text-muted); }
  .sim-badge.local { border-color:var(--success); color:var(--success); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { background:var(--surface2); border:1px solid var(--border); color:var(--text-muted); font-size:12px; padding:4px 10px; border-radius:6px; cursor:pointer; font-family:inherit; transition:all .1s; }
  .chip:hover { border-color:var(--accent); color:var(--text); }
  .chip.active { border-color:var(--accent); background:rgba(109,90,252,.12); color:var(--accent); }
  .field input, .field select { width:100%; }
  .field-input { font-family:inherit; }
</style>
</head>
<body class="chat-page">
  <div class="pl-scene" aria-hidden="true"></div>
  <div class="pl-grid" aria-hidden="true"></div>
  <div class="pl-orbs" aria-hidden="true"><div class="pl-orb"></div><div class="pl-orb"></div><div class="pl-orb"></div></div>
  <div class="pl-grain" aria-hidden="true"></div>
  <header id="chat-header" class="app-header"></header>
  <div id="client-nav"></div>

  <div class="sim-layout">
    <!-- CONTROLES -->
    <div class="sim-controls">
      <div class="sim-card">
        <h3>Contexto</h3>
        <div class="field">
          <textarea id="sim-ctx" class="field-input" rows="3" placeholder="¿Qué está pasando en el stream? (ej: "jugando LoL ranked, casi choco a un amigo")" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--text);font-family:inherit;resize:vertical"></textarea>
          <button id="sim-auto-btn" class="btn btn-ghost btn-sm">🤖 Auto (que lo invente)</button>
        </div>
      </div>

      <div class="sim-card">
        <h3>Categoría</h3>
        <div class="chips" id="sim-cats"></div>
      </div>

      <div class="sim-card">
        <h3>Energía del chat</h3>
        <div class="chips" id="sim-energies"></div>
      </div>

      <div class="sim-card">
        <h3>Opciones</h3>
        <div class="field">
          <label>Cantidad de mensajes</label>
          <select id="sim-cant">
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="200">200</option>
          </select>
        </div>
        <button id="sim-gen-btn" class="btn btn-primary" style="width:100%">✨ Generar chat</button>
        <button id="sim-prompt-btn" class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px" title="Arma un prompt con las reglas adaptadas a tu tema y lo copia para pegarlo en Gemini/ChatGPT">📋 Generar prompt para IA</button>
        <p id="sim-msg" class="settings-msg" hidden></p>
      </div>
    </div>

    <!-- SALIDA -->
    <div class="sim-output">
      <div class="sim-output-head">
        <span>💬 Chat simulado</span>
        <div class="sim-actions">
          <span id="sim-count" class="sim-badge">0 mensajes</span>
          <button id="sim-export-btn" class="btn btn-ghost btn-sm" disabled>💾 Guardar .txt</button>
          <button id="sim-send-btn" class="btn btn-danger btn-sm" disabled>📤 Enviar a Kick</button>
        </div>
      </div>
      <div id="sim-msgs">
        <p id="sim-empty" style="color:var(--text-muted);text-align:center;padding:40px 16px">
          Configurá el contexto y tocá <b>Generar</b> para simular un chat en vivo.</p>
      </div>
    </div>
  </div>

  <script src="js/pl-mascot.js"></script>
  <script type="module" src="js/simulador-ui.js"></script>
</body>
</html>
