<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamChat – Ajustes</title>
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/kd.css" />
<script>try{if(localStorage.getItem('kd_theme')==='light')document.documentElement.classList.add('kd-light')}catch(e){}</script>
</head>
<body class="kd">
  <header id="chat-header" class="kd-top"></header>

  <main class="kd-main" style="max-width:760px">
    <section class="kd-card hl">
      <div class="kd-card-head">
        <span class="kd-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></span>
        <div>
          <div class="kd-card-title">Canal de destino</div>
          <div class="kd-card-sub">Al chat de este canal van los mensajes de Chat, Temáticas y Contexto</div>
        </div>
      </div>

      <div class="kd-field">
        <label for="cfg-channel">Canal</label>
        <input id="cfg-channel" type="text" placeholder="yundev (solo el nombre, no la URL)" spellcheck="false" autocomplete="off" />
      </div>
      <p class="kd-hint" style="margin-top:8px">Podés pegar la URL completa (kick.com/canal): se queda solo con el nombre.</p>

      <div style="display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap">
        <button id="save-settings-btn" class="kd-btn kd-btn-primary" type="button">Guardar</button>
        <p id="settings-msg" class="settings-msg" hidden></p>
      </div>
    </section>
  </main>

  <script type="module" src="js/ajustes-ui.js"></script>
</body>
</html>
