<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamChat – Enviar mensajes</title>
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/client-nav.css" />
<link rel="stylesheet" href="css/chat.css" />
</head>
<body class="chat-page">
  <div class="pl-feed" aria-hidden="true">
    <div class="pl-feed-col"></div>
    <div class="pl-feed-col"></div>
    <div class="pl-feed-col"></div>
    <div class="pl-feed-col"></div>
  </div>
  <div class="pl-feeds-overlay"></div>
  <header id="chat-header" class="app-header"></header>
  <div id="client-nav"></div>

  <main class="chat-shell">

    <!-- ─── MITAD SUPERIOR: grilla de archivos .txt ─── -->
    <section class="pair-top">
      <div class="pair-top-header">
        <span class="pair-title">Archivos de mensajes (.txt)</span>
        <div class="pair-actions">
          <button id="load-file-btn" class="btn btn-secondary btn-sm">+ Agregar .txt</button>
        </div>
      </div>
      <div id="file-grid" class="file-grid">
        <div class="empty-state full">Sin archivos cargados. Agregá tus .txt.</div>
      </div>
    </section>

    <!-- ── MITAD INFERIOR: mensajes enviados | bots estadísticas ── -->
    <section class="pair-bottom">
      <div class="half-left">
        <div class="pair-title">Enviando</div>
        <div class="progress-track">
          <div id="progress-bar" class="progress-bar" style="width:0%"></div>
        </div>
        <div class="msg-preview-header">
          <span id="active-file-name" class="active-file-name">Ningún archivo seleccionado</span>
          <span id="msg-count" class="msg-count"></span>
        </div>
        <ul id="msg-list" class="msg-list">
          <li class="empty-state">Seleccioná un archivo de arriba y tocá Iniciar.</li>
        </ul>
        <footer class="send-controls">
          <span id="send-status" class="send-status"></span>
          <div class="send-btns">
            <button id="send-once-btn" class="btn btn-ghost" disabled>Añadir sg</button>
            <button id="start-btn"     class="btn btn-primary" disabled>▶ Iniciar</button>
            <button id="stop-btn"      class="btn btn-danger"  disabled>■ Detener</button>
            <button id="reset-btn"     class="btn btn-ghost"   style="display:none">↻ Reiniciar</button>
          </div>
        </footer>
      </div>

      <div class="half-right">
        <div class="pair-title">
          Bots — mensajes enviados
          <button id="reset-stats-btn" class="btn btn-ghost btn-xs">Reset</button>
        </div>
        <div id="bots-stats" class="bots-stats">
          <div class="empty-state">Aún no se enviaron mensajes.</div>
        </div>
      </div>
    </section>

  </main>

  <div class="pl-feeds-spacer"></div>
  <script src="js/pl-mascot.js"></script>
  <script type="module" src="js/chat-ui.js"></script>
</body>
</html>
